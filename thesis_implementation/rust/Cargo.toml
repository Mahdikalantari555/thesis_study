[package]
name = "ssl_anomaly_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "ssl_anomaly_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
numpy = "0.22"
pyo3 = { version = "0.22" }
ndarray = "0.16"

[profile.release]
opt-level = 3
lto = true
