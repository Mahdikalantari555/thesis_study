[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssl_anomaly"
version = "0.1.0"
description = "Self-supervised phenology-aware anomaly detection on Landsat field-level time series (sugarcane thesis)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Mahdi Kalantari", email = "mahdi@example.com" }]
dependencies = [
  # Numerics / scientific
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "xarray>=2024.2",
  "numba>=0.59",
  # Geo / raster / zarr
  "rasterio>=1.3",
  "rioxarray>=0.15",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "zarr>=2.18",
  # PyTorch / Lightning
  "torch>=2.2",
  "lightning>=2.2",
  "safetensors>=0.4",
  # Config / logging / CLI
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "rich>=13.7",
  "tqdm>=4.66",
  "click>=8.1",
  "psutil>=5.9",
  # Eval / stats / figures
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  # Tracking
  "mlflow>=2.11",
  # Parquet
  "pyarrow>=15.0",
  "fastparquet>=2024.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "pyright>=1.1",
  "ipython>=8.20",
]
colab = [
  "gdown>=5.1",
  "optuna>=3.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ssl_anomaly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=ssl_anomaly --cov-report=term-missing"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "golden: golden regression tests",
  "parity: backend parity tests (Rust vs NumPy)",
  "integration: end-to-end integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "SIM", "C4",
  "PT", "RUF",
]
ignore = [
  "B008",  # do not perform function calls in argument defaults
  "B007",  # unused loop control vars are fine in scientific code
  "N802",  # allow _CamelCase helper functions in tests
  "N803",  # allow single-letter math args (X, T, B, d) per scientific convention
  "N806",  # allow upper-case variable names in scientific code (X, Z arrays)
  "N812",  # allow `import lightning as L`
  "UP042", # StrEnum is 3.11+; our code targets 3.11 but str+Enum is fine
  "SIM108",# ternary rewrites are less readable in math code
  "RUF059",# unpacked-variable false positives
  "RUF046",# unnecessary int-cast; harmless and keeps intent explicit
  "RUF005",# unpacking-style rewrites; list-concat is clearer here
  "RUF002",# ambiguous unicode chars in docstrings
  "B905",  # zip strict= is Python 3.10+; we control both sides
  "E741",  # l as variable name in EVI formula is standard
  "E501",  # line length enforced by formatter / not critical
  "F841",  # unused local variables in scaffolded code paths
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "B011"]
"scripts/**" = ["T201"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportGeneralTypeIssues = "warning"

[tool.coverage.run]
branch = true
source = ["src/ssl_anomaly"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[project.scripts]
ssl-anomaly = "ssl_anomaly.cli:cli"
ssl-ingest = "ssl_anomaly.cli:ingest"
ssl-segment = "ssl_anomaly.cli:segment"
ssl-baseline = "ssl_anomaly.cli:baseline"
ssl-train = "ssl_anomaly.cli:train"
ssl-evaluate = "ssl_anomaly.cli:evaluate"
ssl-export = "ssl_anomaly.cli:export"
