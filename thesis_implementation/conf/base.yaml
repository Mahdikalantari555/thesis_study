# Base configuration — defaults match the laptop CPU profile and primary thesis setup.
# Composable groups: profile, phase_axis, input, model, eval, xai
defaults:
  - profile: laptop
  - phase_axis: dsh
  - input: optical_thermal
  - model: ssl_masked_recon
  - eval: loyo
  - xai: default
  - _self_

verbose: 1
seed: 42

paths:
  fields_zarr: data/processed/fields.zarr
  era5_zarr: data/processed/era5.zarr
  cycles_parquet: data/processed/cycles.parquet
  splits_json: data/processed/splits.json
  mlflow_db: mlruns/mlflow.db
  reports_dir: reports
